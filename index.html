<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>INI-CET Revision OS</title>
<meta name="description" content="PYT cluster revision, timed 50-question blocks, Error OS and weak-topic diagnosis for INI-CET.">
<meta property="og:title" content="INI-CET Revision OS">
<meta property="og:description" content="PYT cluster revision, timed 50-question blocks, Error OS and weak-topic diagnosis for INI-CET.">
<meta name="theme-color" content="#0b1220">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">

<script>
  // Ensure trailing slash on GitHub Pages directory paths so relative assets resolve properly
  (function() {
    var p = window.location.pathname;
    if (p && !p.endsWith('/') && !p.split('/').pop().includes('.')) {
      window.location.replace(p + '/' + window.location.search + window.location.hash);
    }
  })();
</script>

<!-- High-Yield Core Datasets loaded upfront -->
<script src="./data/clusters.js"></script>
<script src="./data/questions.js"></script>
<script src="./data/coverage.js"></script>
<script src="./data/pyq.js"></script>

<style>
  #boot-splash {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #0b1220;
    color: #f8fafc;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    text-align: center;
    padding: 24px;
    box-sizing: border-box;
  }
  .splash-pulse {
    font-size: 3.2rem;
    margin-bottom: 16px;
    filter: drop-shadow(0 0 16px rgba(56, 189, 248, 0.4));
    animation: splash-float 1.8s ease-in-out infinite alternate;
  }
  @keyframes splash-float {
    0% { transform: translateY(0px) scale(0.98); }
    100% { transform: translateY(-8px) scale(1.05); }
  }
  .splash-bar {
    width: 220px;
    height: 6px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 9999px;
    overflow: hidden;
    position: relative;
    margin-top: 18px;
  }
  .splash-prog {
    width: 60%;
    height: 100%;
    background: linear-gradient(90deg, #38bdf8, #818cf8);
    border-radius: 9999px;
    animation: splash-load 1.4s ease-in-out infinite;
  }
  @keyframes splash-load {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(200%); }
  }
</style>
</head>
<body>
<div id="root">
  <div id="boot-splash">
    <div class="splash-pulse">🩺</div>
    <h1 style="font-size: 1.4rem; font-weight: 800; margin: 0 0 8px 0; background: linear-gradient(135deg, #38bdf8, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
      INI-CET Revision OS
    </h1>
    <p style="font-size: 0.9rem; color: #94a3b8; margin: 0; max-width: 320px; line-height: 1.4;">
      Loading high-yield PYT clusters, diagnostic engine & visual vaults...
    </p>
    <div class="splash-bar">
      <div class="splash-prog"></div>
    </div>
  </div>
</div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
